[project]
name = "deeptrace-api"
version = "0.1.0"
description = "深度伪造检测平台控制面与测试检测器"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.39,<2",
  "celery[redis]>=5.5,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "python-magic>=0.4.27,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "python-docx>=1.2,<2",
  "reportlab>=4.4,<5",
  "redis>=6,<7",
  "sqlalchemy>=2.0.41,<3",
  "sse-starlette>=2.4,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
inference = [
  "dlib>=19.24,<20",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "safetensors>=0.4,<1",
  "pyyaml>=6.0,<7",
  "scikit-image>=0.25,<1",
  "scikit-learn>=1.5,<2",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers>=4.53,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "pypdf>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
